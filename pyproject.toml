[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecup-quality-c-plus2"
version = "1.0.0"
description = "Text-only product policy classifier with an exact five-fold LoRA-delta soup"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.6",
  "transformers>=5.5,<6",
  "peft>=0.15",
  "safetensors>=0.4",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["submission/rationale_schema.py"]
